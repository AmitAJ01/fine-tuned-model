version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: finetuneops-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./ml/data:/app/ml/data
      - ./experiments:/app/experiments
    environment:
      - PYTHONUNBUFFERED=1
      - FORCE_CUDA=0
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: finetuneops-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
